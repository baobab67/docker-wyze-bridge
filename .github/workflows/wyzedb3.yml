name: wyzedb3 doorbell test build

# Builds the doorbell test images for Roy's fork only (amd64; HA runs
# on x86_64):
#   ghcr.io/<owner>/docker-wyze-bridge:wyzedb3 (+ :sha-<sha>)
#   ghcr.io/<owner>/docker-wyze-bridge-doorbell-homeassistant:<config.yaml version>
on:
  push:
    branches: [wyzedb3]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Run tests
        run: go test -cover ./...
      - name: Vet
        run: go vet ./...

  build:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Names and version
        id: envs
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "bridge=ghcr.io/${OWNER}/docker-wyze-bridge" >> "$GITHUB_OUTPUT"
          echo "addon=ghcr.io/${OWNER}/docker-wyze-bridge-doorbell-homeassistant" >> "$GITHUB_OUTPUT"
          version=$(awk -F': ' '$1=="version"{print $2; exit}' home_assistant/wyze_bridge_doorbell/config.yaml | tr -d '\r')
          [ -n "$version" ] || { echo "no version in config.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push bridge image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.envs.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.envs.outputs.version }}
          tags: |
            ${{ steps.envs.outputs.bridge }}:wyzedb3
            ${{ steps.envs.outputs.bridge }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=wyzedb3-bridge
          cache-to: type=gha,mode=max,scope=wyzedb3-bridge
          provenance: false

      - name: Build and push HA app image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ./home_assistant/wyze_bridge_doorbell
          file: ./home_assistant/wyze_bridge_doorbell/Dockerfile
          platforms: linux/amd64
          build-args: |
            WYZE_BRIDGE_IMAGE=${{ steps.envs.outputs.bridge }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.envs.outputs.version }}
            io.hass.name=Wyze Bridge (doorbell test)
            io.hass.description=Wyze Bridge 4.7.0 + go2rtc PR 2643 (WYZEDB3)
            io.hass.version=${{ steps.envs.outputs.version }}
            io.hass.type=addon
            io.hass.arch=amd64
          tags: |
            ${{ steps.envs.outputs.addon }}:${{ steps.envs.outputs.version }}
            ${{ steps.envs.outputs.addon }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=wyzedb3-addon
          cache-to: type=gha,mode=max,scope=wyzedb3-addon
          provenance: false
