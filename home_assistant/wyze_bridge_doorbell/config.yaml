name: Wyze Bridge (doorbell test)
description: >-
  Test build of IDisposable's Wyze Bridge 4.7.0 with go2rtc 1.9.14 plus
  go2rtc PR #2643 (Wyze Video Doorbell v1 / WYZEDB3 support). Runs on
  its own ports so it can sit next to the stable Wyze Bridge app.
slug: wyze_bridge_doorbell
url: https://github.com/baobab67/docker-wyze-bridge/tree/wyzedb3
image: ghcr.io/baobab67/docker-wyze-bridge-doorbell-homeassistant
version: 4.7.0-wyzedb3.3
stage: experimental
arch:
  - amd64
startup: application
boot: manual
init: false
hassio_api: true
# Host networking, like the stable app: TUTK LAN discovery timed out
# behind Docker NAT. The bridge's ports are fixed (5080/1984/8554/...),
# so stop the stable Wyze Bridge app before starting this one.
host_network: true
ingress: true
ingress_port: 5080
panel_icon: mdi:doorbell-video
watchdog: http://[HOST]:[PORT:5080]/api/health
ports:
  5080/tcp: 5080
  1984/tcp: 1984
  8554/tcp: 8554
  8888/tcp: 8888
  8889/tcp: 8889
  8189/udp: 8189
ports_description:
  5080/tcp: Bridge WebUI
  1984/tcp: go2rtc native UI (optional)
  8554/tcp: RTSP
  8888/tcp: HLS
  8889/tcp: WebRTC HTTP
  8189/udp: WebRTC ICE
map:
  - addon_config:rw
  - media:rw
services:
  - mqtt:want
options:
  wyze:
    email: ""
    password: ""
    api_id: ""
    api_key: ""
  bridge:
    ip: ""
  camera:
    quality: hd
    audio: true
    options: []
  snapshot: {}
  record: {}
  mqtt:
    enabled: false
  filter:
    macs:
      - 7C78B2199706
  location: {}
  webhooks: {}
  gwell:
    manual_ips: []
  models:
    overrides: []
  debug: {}
schema:
  wyze:
    email: email?
    password: password?
    api_id: str?
    api_key: str?
    totp_key: str?
  bridge:
    ip: 'match(^($|[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$))?'
    auth: bool?
    username: str?
    password: password?
    api_token: str?
    stream_auth: str?
    go2rtc_url: url?
  camera:
    quality: list(hd|sd)?
    audio: bool?
    lan_ip_resolve: bool?
    lan_ip_sweep: bool?
    lan_ip_recheck: 'match(^\d+[smhd]?$)?'
    options:
      - cam_name: str?
        quality: list(hd|sd)?
        audio: bool?
        record: bool?
  snapshot:
    path: str?
    file_name: str?
    interval: int?
    keep: 'match(^\d+[smhd]?$)?'
    rotate: str?
    cameras:
      - str?
  record:
    all: bool?
    path: str?
    file_name: str?
    length: 'match(^\d+[smhd]?$)?'
    keep: 'match(^\d+[smhd]?$)?'
  mqtt:
    enabled: bool?
    host: str?
    port: port?
    username: str?
    password: password?
    topic: str?
    discovery_topic: str?
  filter:
    names:
      - str?
    models:
      - str?
    macs:
      - str?
    blocks: bool?
  location:
    latitude: float?
    longitude: float?
  webhooks:
    urls:
      - url?
  gwell:
    enabled: bool?
    manual_ips:
      - mac: str?
        lan_ip: str?
  models:
    overrides:
      - model: str?
        name: str?
        is_gwell: bool?
        is_gwell_p2p: bool?
        is_webrtc: bool?
        is_pan: bool?
        is_doorbell: bool?
  debug:
    log_level: list(trace|debug|info|warn|error)?
    force_iotc_detail: bool?
